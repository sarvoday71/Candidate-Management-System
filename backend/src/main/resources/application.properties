spring.application.name=candidate-management

# Loads application-local.properties (git-ignored), which holds the DB URL and credentials
spring.profiles.active=local

spring.datasource.driver-class-name=org.postgresql.Driver

# Prisma owns the schema (npm run db:push); Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
