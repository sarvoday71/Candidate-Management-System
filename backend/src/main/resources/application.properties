spring.application.name=candidate-management

# Loads application-local.properties (git-ignored), which holds the DB URL and credentials
spring.profiles.active=local

spring.datasource.driver-class-name=org.postgresql.Driver

# Prisma owns the schema (npm run db:push); Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL logging is synchronous console I/O on every query, so it is off by default.
# To debug: run with --spring.jpa.show-sql=true
spring.jpa.show-sql=false

# A duplicate email is a handled 409, not an incident; stop Hibernate logging each one as a multi-line WARN.
# Genuine failures still surface as exceptions and are logged by Spring.
logging.level.org.hibernate.orm.jdbc.error=ERROR

# Don't hold a DB connection for the whole HTTP request; services return DTOs, so nothing is lazy-loaded later.
spring.jpa.open-in-view=false

# Connection pool: fail fast under overload instead of queueing for 30s, and recycle connections
# before Neon/PgBouncer drops idle ones.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Cheap concurrency for I/O-bound requests (Java 21): a waiting request no longer pins a platform thread.
spring.threads.virtual.enabled=true

# JSON list responses compress ~5-10x.
server.compression.enabled=true
server.compression.min-response-size=1024

# Dashboard stats: cached briefly, evicted immediately on any write.
spring.cache.type=caffeine
spring.cache.cache-names=candidateStats
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=30s
